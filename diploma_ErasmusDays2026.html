<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diplome ErasmusDays</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:ital,wght@0,500;0,700;0,800;1,700&display=swap">
<style>
html{color-scheme:light dark}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: logoul sus, apoi o singură coloană: previzualizarea diplomei, formularul și descărcarea. */
:root{
  --bg:#EDF1FB; --surface:#FFFFFF; --ink:#0B1F5C; --muted:#5A6690; --line:#CBD5F0;
  --band:#18408F; --on-band:#FFFFFF; --gold:#FFDD00; --on-gold:#2A2100;
  --accent:#18408F; --ok:#17794E; --ok-bg:#DDF3E8; --bad:#B93226; --bad-bg:#FBE3E0;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#060F2E; --surface:#0F1D4F; --ink:#EAF0FF; --muted:#A3B0DA; --line:#2A3B7D;
  --band:#122F6B; --on-band:#FFFFFF; --gold:#FFDD00; --on-gold:#2A2100;
  --accent:#9DB8FF; --ok:#6FDCA6; --ok-bg:#0E3A2A; --bad:#FF9A8F; --bad-bg:#4A1A15; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#060F2E; --surface:#0F1D4F; --ink:#EAF0FF; --muted:#A3B0DA; --line:#2A3B7D;
  --band:#122F6B; --on-band:#FFFFFF; --gold:#FFDD00; --on-gold:#2A2100;
  --accent:#9DB8FF; --ok:#6FDCA6; --ok-bg:#0E3A2A; --bad:#FF9A8F; --bad-bg:#4A1A15; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;font-weight:500}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
.band{background:var(--band);color:var(--on-band);padding:18px 16px 20px;text-align:center}
.band img{width:112px;height:112px;display:block;margin:0 auto 8px}
.band h1{font-size:26px;font-weight:800}
.band p{font-weight:700;margin-top:4px}
.band .dates{display:inline-block;margin-top:8px;background:var(--gold);color:var(--on-gold);font-weight:800;border-radius:999px;padding:3px 14px;font-size:15px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
.lbl{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>*{min-width:0}
input,textarea{font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
textarea{min-height:150px;resize:vertical;line-height:1.5}
canvas{width:100%;height:auto;border-radius:10px;display:block}
.btn{background:var(--gold);color:var(--on-gold);font-family:var(--display);font-weight:800;font-size:21px;border-radius:14px;min-height:56px;padding:10px 18px;width:100%}
.btn.alt{background:var(--surface);color:var(--accent);border:2px solid var(--line);font-size:18px;min-height:50px}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{background:var(--surface);border:2px solid var(--line);border-radius:12px;min-height:48px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--band);border-color:var(--band);color:var(--on-band)}
.note{color:var(--muted);font-size:14px;font-weight:700}
.msg{border-radius:12px;padding:10px 12px;font-weight:800;text-align:center}
.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.bad{background:var(--bad-bg);color:var(--bad)}
</style>
</head>

<main class="wrap">
  <canvas id="prev" aria-label="Previzualizarea diplomei"></canvas>
  <div class="seg" role="group" aria-label="Câte diplome">
    <button id="mode-one" aria-pressed="true">O diplomă</button>
    <button id="mode-many" aria-pressed="false">Toată clasa</button>
  </div>
  <div class="field" id="f-name"><label class="lbl" for="name">Numele și prenumele elevului</label><input id="name" maxlength="50" placeholder="de exemplu: Popescu Maria"></div>
  <div class="field" id="f-names" hidden><label class="lbl" for="names">Elevii clasei, câte un nume pe rând</label><textarea id="names" placeholder="Popescu Maria&#10;Ionescu Andrei&#10;…"></textarea><p class="note" id="count"></p></div>
  <div class="two">
    <div class="field"><label class="lbl" for="cls">Clasa</label><input id="cls" maxlength="20" placeholder="a V-a B"></div>
    <div class="field"><label class="lbl" for="date">Data acordării</label><input id="date" type="date"></div>
  </div>
  <div class="field"><label class="lbl" for="act">Activitatea sau disciplina (opțional)</label><input id="act" maxlength="60" placeholder="de exemplu: Matematica unește Europa"></div>
  <div class="field"><label class="lbl" for="coord">Profesor coordonator (opțional)</label><input id="coord" maxlength="50" placeholder="de exemplu: prof. Ionescu Ana"></div>
  <p class="note">Coordonator proiecte europene: GHINESCU Vasile · Eveniment: ERASMUS DayS – Școala Gimnazială „Petru Rareș” din Chiajna</p>
  <button class="btn" id="dl">Descarcă diploma PDF</button>
  <button class="btn alt" id="dlpng">Descarcă diploma PNG</button>
  <div id="msg" role="status"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id),KEY="diplome-erasmusdays";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let S={name:"",names:"",cls:"",date:today(),act:"",coord:"",many:false};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}
if(S.coord==="prof. Vasile GHINESCU")S.coord="";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const SLOGAN="Învățăm împreună, creștem împreună, construim viitorul Europei!";
const roDate=x=>{const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(x||"");return m?m[3]+"."+m[2]+"."+m[1]:""};
const list=()=>S.names.split("\n").map(x=>x.trim()).filter(Boolean);
const logo=$("logo"),banner=$("banner");

function draw(c,nm){
  const W=1600,H=1131;c.width=W;c.height=H;const x=c.getContext("2d");
  const D='"Baloo 2","Trebuchet MS",sans-serif',B='"Nunito","Segoe UI",sans-serif';
  const BLUE="#18408F",MAG="#A12A85",GOLD="#FFD500",INK="#1B2B5E";
  x.fillStyle="#FFFFFF";x.fillRect(0,0,W,H);
  // chenar: albastru gros, fir auriu în interior
  x.strokeStyle=BLUE;x.lineWidth=14;x.strokeRect(27,27,W-54,H-54);x.strokeStyle=GOLD;x.lineWidth=4;x.strokeRect(44,44,W-88,H-88);
  // bannerul oficial, pe fondul alb al paginii
  const bw=1010,bh=bw*410/1242;if(banner.complete&&banner.naturalWidth)x.drawImage(banner,(W-bw)/2,62,bw,bh);
  // forme în culorile bannerului, în colțurile de jos
  const sh=(f,col)=>{x.fillStyle=col;x.beginPath();f();x.fill()};
  sh(()=>{x.moveTo(46,1085);x.arc(46,1085,92,-Math.PI/2,0)},"#E30613");sh(()=>x.arc(200,1085,38,Math.PI,0),MAG);sh(()=>x.arc(275,1050,20,0,7),"#95C11F");
  sh(()=>{x.moveTo(1554,1085);x.arc(1554,1085,92,Math.PI,-Math.PI/2)},"#1D9FDA");sh(()=>x.arc(1400,1085,38,Math.PI,0),"#95C11F");sh(()=>{x.moveTo(1300,1085);x.lineTo(1322,1035);x.lineTo(1352,1035);x.lineTo(1330,1085)},GOLD);
  x.textAlign="center";
  const T=(t,y,f,col)=>{x.font=f;x.fillStyle=col||INK;x.fillText(t,W/2,y)};
  T("Școala Gimnazială „Petru Rareș” din Chiajna",440,"800 33px "+B,BLUE);
  T("DIPLOMĂ",543,"800 96px "+D,BLUE);
  x.fillStyle=GOLD;x.fillRect(W/2-150,560,300,8);
  T("se acordă elevului / elevei",604,"700 28px "+B);
  const name=nm||"Numele și prenumele";let fs=82;x.font="800 "+fs+"px "+D;while(x.measureText(name).width>W-300&&fs>40){fs-=4;x.font="800 "+fs+"px "+D}
  T(name,690,"800 "+fs+"px "+D,MAG);
  T("din clasa "+(S.cls.trim()||"…"),742,"800 32px "+B,BLUE);
  T("pentru participarea la activitățile ERASMUS DayS, 12–17 octombrie 2026",792,"700 30px "+B);
  const a=S.act.trim();if(a)T(a,838,"800 30px "+B,BLUE);
  T("„"+SLOGAN+"”",a?884:842,"italic 700 27px "+B,MAG);
  // sigiliul ediției a 10-a, între semnături
  if(logo.complete&&logo.naturalWidth)x.drawImage(logo,W/2-70,906,140,140);
  T(roDate(S.date),1076,"800 24px "+B,BLUE);
  const sig=(al,px,l1,l2)=>{x.textAlign=al;x.font="700 24px "+B;x.fillStyle=INK;x.fillText(l1,px,940);x.font="800 28px "+B;x.fillStyle=BLUE;x.fillText(l2,px,980)};
  if(S.coord.trim())sig("left",150,"Profesor coordonator,",S.coord.trim());sig("right",W-150,"Director,","prof. ROȘCA Gabriela Mihaela")}

function refresh(){
  $("mode-one").setAttribute("aria-pressed",!S.many);$("mode-many").setAttribute("aria-pressed",S.many);
  $("f-name").hidden=S.many;$("f-names").hidden=!S.many;
  const n=list().length;$("count").textContent=n?n+(n===1?" diplomă":" diplome")+" într-un singur PDF, câte una pe pagină.":"Scrie numele elevilor, câte unul pe rând.";
  $("dl").textContent=S.many?"Descarcă diplomele PDF"+(n?" ("+n+")":""):"Descarcă diploma PDF";
  $("dlpng").textContent=S.many?"Descarcă diplomele PNG"+(n?" ("+n+" fișiere)":""):"Descarcă diploma PNG";
  draw($("prev"),S.many?list()[0]:S.name.trim())}
["name","names","cls","date","act","coord"].forEach(k=>{$(k).value=S[k];$(k).addEventListener("input",e=>{S[k]=e.target.value;save();refresh()})});
$("mode-one").onclick=()=>{S.many=false;save();refresh()};$("mode-many").onclick=()=>{S.many=true;save();refresh()};
logo.addEventListener("load",refresh);banner.addEventListener("load",refresh);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(refresh).catch(()=>{});
refresh();

// ---------- Descărcare (site independent: salvare directă din browser) ----------
const say=(t,bad)=>{$("msg").className=t?"msg "+(bad?"bad":"ok"):"";$("msg").textContent=t};
const slug=t=>t.replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-|-$/g,"");
function saveBlob(blob,filename){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function chosen(){const names=S.many?list():[S.name.trim()];if(!names.length||!names[0]){say(S.many?"Scrie cel puțin un nume.":"Scrie numele elevului.",true);return null}return names}
$("dl").onclick=async()=>{
  const names=chosen();if(!names)return;say("");
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J){say("Generatorul PDF nu s-a încărcat. Verifică legătura la internet și reîncarcă pagina, sau descarcă PNG.",true);return}
  $("dl").disabled=true;
  try{try{await document.fonts.ready}catch(e){}
    const c=document.createElement("canvas"),doc=new J({orientation:"landscape",unit:"mm",format:"a4"});
    names.forEach((n,i)=>{if(i)doc.addPage();draw(c,n);doc.addImage(c.toDataURL("image/jpeg",.92),"JPEG",0,0,297,210)});
    saveBlob(doc.output("blob"),"Diploma-ErasmusDays-"+slug(S.many?"clasa-"+(S.cls||"elevi"):names[0])+".pdf");
    say(names.length>1?"Diplomele au fost generate.":"Diploma a fost generată.")}
  catch(e){say("Descărcarea nu a reușit. Încearcă din nou.",true)}
  $("dl").disabled=false};
$("dlpng").onclick=async()=>{
  const names=chosen();if(!names)return;say("");$("dlpng").disabled=true;
  try{try{await document.fonts.ready}catch(e){}
    const c=document.createElement("canvas");
    for(const n of names){draw(c,n);const b=await new Promise(r=>c.toBlob(r,"image/png"));saveBlob(b,"Diploma-ErasmusDays-"+slug(n)+".png");if(names.length>1)await new Promise(r=>setTimeout(r,350))}
    say(names.length>1?"Diplomele au fost generate. Dacă browserul întreabă, permite descărcările multiple.":"Diploma a fost generată.")}
  catch(e){say("Descărcarea nu a reușit. Încearcă din nou.",true)}
  $("dlpng").disabled=false};
</script>
</body>
</html>
